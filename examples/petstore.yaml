openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
  description: A small pet store API used as the API Shakedown example.
servers:
  - url: http://localhost:8080/v1
security:
  - apiKey: []
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      tags: [pets]
      parameters:
        - name: limit
          in: query
          description: Maximum number of pets to return (1-100).
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PetStatus" }
      responses:
        200:
          description: A page of pets.
          headers:
            X-Next-Cursor:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pet" }
              example:
                - { id: 1, name: Rex, status: available }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createPet
      summary: Add a pet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPet" }
      responses:
        201:
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        400:
          $ref: "#/components/responses/Error"
  /pets/{petId}:
    parameters:
      - $ref: "#/components/parameters/PetId"
    get:
      operationId: getPet
      summary: Get a pet by id
      tags: [pets]
      responses:
        200:
          description: The pet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        404:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deletePet
      summary: Delete a pet
      tags: [pets]
      responses:
        204:
          description: Deleted.
        404:
          $ref: "#/components/responses/Error"
  /health:
    get:
      summary: Liveness probe
      tags: [ops]
      security: []
      responses:
        200:
          description: The service is up.
          content:
            text/plain:
              schema: { type: string }
              example: ok
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    PetStatus:
      type: string
      enum: [available, pending, sold]
    NewPet:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        status: { $ref: "#/components/schemas/PetStatus" }
        tags:
          type: array
          items: { type: string }
    Pet:
      allOf:
        - $ref: "#/components/schemas/NewPet"
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer }
        message: { type: string }
