name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e packages/agentpanel -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build packages/agentpanel --outdir dist
      - run: python -m build . --outdir dist
      - run: twine check --strict dist/*
      - name: Clean install from the wheels and generate a harness
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/shakedown run examples/petstore.yaml --out /tmp/harness --offline

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t api-shakedown .
      - run: docker run --rm api-shakedown version
      - run: docker run --rm api-shakedown run /opt/shakedown/examples/petstore.yaml --out /tmp/h --offline
