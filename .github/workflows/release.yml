name: Release

# Push a tag like v0.1.0 to build and publish both packages to PyPI.
# Requires a PyPI trusted publisher per package: agentpanel -> environment "pypi",
# api-shakedown -> environment "pypi-api-shakedown" (see RELEASING.md).
on:
  push:
    tags: ["v*"]

# Read-only by default; the publish jobs below ask for exactly what they need.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build packages/agentpanel --outdir dist
      - run: python -m build . --outdir dist
      - run: twine check --strict dist/*
      - name: Tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ls dist | grep -q "agentpanel-${tag}-" || { echo "agentpanel is not $tag"; exit 1; }
          ls dist | grep -q "api_shakedown-${tag}-" || { echo "api-shakedown is not $tag"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist-agentpanel
          path: dist/agentpanel-*
      - uses: actions/upload-artifact@v7
        with:
          name: dist-api-shakedown
          path: dist/api_shakedown-*

  # One job and environment per package: PyPI's trusted publishing ties each project to
  # (repository, workflow, environment), and agentpanel must exist before api-shakedown.
  publish-agentpanel:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing: no API token stored in the repo
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-agentpanel
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-api-shakedown:
    needs: publish-agentpanel
    runs-on: ubuntu-latest
    environment: pypi-api-shakedown
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-api-shakedown
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/api-shakedown
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
